# 推送到 cursor/baodeguo-quote1-bd62 後，自動同步到 Quote1.0 main → Vercel 自動部署
#
# 【只需設定一次】在 dowaterlightout repo 加入 Secret：
#   名稱：QUOTE1_PUSH_TOKEN
#   值：GitHub Personal Access Token（需 Quote1.0 的 repo 寫入權限）
#   設定位置：GitHub → dowaterlightout → Settings → Secrets and variables → Actions

name: Deploy Quote1.0

on:
  push:
    branches:
      - cursor/baodeguo-quote1-bd62
  workflow_dispatch:

jobs:
  sync-to-quote1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Quote1.0 main
        env:
          TOKEN: ${{ secrets.QUOTE1_PUSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::缺少 QUOTE1_PUSH_TOKEN。請到 dowaterlightout → Settings → Secrets 新增。"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add quote1 "https://x-access-token:${TOKEN}@github.com/AndyKao-commits/Quote1.0.git"
          git push quote1 "HEAD:main" --force
